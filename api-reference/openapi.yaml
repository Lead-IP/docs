# Copy of lovable-temp-old/openapi.yaml as on staging (2026-10-23). Re-copy when the spec changes.
openapi: 3.1.0
info:
  title: LeadLex API
  version: "2026-04-17"
  description: |
    LeadLex CRM public API. Multi-tenant, workspace-scoped endpoints for contacts, companies,
    deals, campaigns, Lexi AI, webhooks, and analytics. All requests require a workspace API
    key (Bearer `wbk_<48 chars>`) and are rate-limited per key.

    Error responses follow `{ error: { code, message, request_id } }`. Write endpoints accept
    an optional `Idempotency-Key` header for safe retries. Every response carries
    `X-Request-ID` and `X-RateLimit-*` headers.
  contact:
    name: LeadLex API Support
    email: support@leadlex.com
    url: https://leadlex.com/docs
  license:
    name: Proprietary
    url: https://leadlex.com/terms
servers:
  - url: https://data.leadlex.com/functions/v1/api-gateway
    description: Production
tags:
  - name: Contacts
    description: Contact CRUD, tagging, notes, and exports.
  - name: Companies
    description: Company CRUD, links, and exports.
  - name: Deals
    description: Deal pipeline, bulk operations, and notes.
  - name: Pipelines
    description: Pipeline metadata.
  - name: Tasks
    description: Task management.
  - name: Notes
    description: Workspace-level notes.
  - name: Lists
    description: Contact lists and memberships.
  - name: Tags
    description: Tag catalog.
  - name: Activities
    description: Activity tracking.
  - name: Campaigns
    description: Outreach campaigns, steps, contacts, stats.
  - name: Prospector
    description: Prospect discovery and reveal.
  - name: Lexi AI
    description: Lexi assistant chat, tasks, autoresearch, and personalization.
  - name: Conversations
    description: Lexi conversation history.
  - name: Webhooks
    description: Webhook subscriptions and logs.
  - name: Events
    description: Webhook event catalog.
  - name: Email
    description: Email send, threads, sync and correspondents.
  - name: Calendar
    description: Calendar events and sync.
  - name: Channels
    description: Multi-channel messaging (WhatsApp, SMS, etc.).
  - name: Enrichment
    description: Work-email lookup.
  - name: AI
    description: AI analysis endpoints.
  - name: Documents
    description: Document management and linking.
  - name: Workflows
    description: Automation workflows.
  - name: API Keys
    description: Workspace API key management.
  - name: Settings
    description: Workspace settings and provider config.
  - name: Audit Logs
    description: Audit log access.
  - name: Users
    description: Workspace users.
  - name: Analytics
    description: Outreach analytics.
  - name: Stats
    description: Pipeline and activity statistics.
  - name: Import
    description: Bulk import from CSV/JSON.
  - name: Export
    description: Bulk export as CSV.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: wbk_<48 chars>
      description: |
        Workspace API key. Format `wbk_` followed by 48 URL-safe characters.
        Send as `Authorization: Bearer wbk_...`.
  headers:
    X-Request-ID:
      description: Unique identifier for this request (UUID v4).
      schema:
        type: string
        format: uuid
    X-RateLimit-Limit:
      description: Maximum requests allowed in the current window.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    X-RateLimit-Reset:
      description: Unix epoch seconds when the window resets.
      schema:
        type: integer
  parameters:
    PageQuery:
      name: page
      in: query
      description: 1-indexed page number.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageQuery:
      name: per_page
      in: query
      description: Items per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: Optional client-generated key (UUID recommended) to deduplicate retries. Cached responses replay within 24h.
      required: false
      schema:
        type: string
        maxLength: 255
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier (UUID).
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: Invalid input.
            request_id:
              type: string
              format: uuid
    Meta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        title: { type: string }
        company_name: { type: string }
        linkedin_url: { type: string, format: uri }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactCreate:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        title: { type: string }
        company_name: { type: string }
        linkedin_url: { type: string, format: uri }
        tags:
          type: array
          items: { type: string }
    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string }
        industry: { type: string }
        size: { type: string }
        description: { type: string }
        website: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Deal:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        amount: { type: number }
        currency: { type: string, example: EUR }
        stage: { type: string }
        pipeline_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        probability: { type: number, minimum: 0, maximum: 1 }
        close_date: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Pipeline:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        stages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              order: { type: integer }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        due_date: { type: string, format: date-time }
        assigned_to_user_id: { type: string, format: uuid }
        assigned_to_user_ids:
          type: array
          items: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        deal_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        content: { type: string }
        contact_id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        deal_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    List:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        contact_count: { type: integer }
        created_at: { type: string, format: date-time }
    Tag:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }
    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [email, call, meeting, note, task, other]
        subject: { type: string }
        body: { type: string }
        contact_id: { type: string, format: uuid }
        deal_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Campaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [draft, active, paused, completed]
        description: { type: string }
        created_at: { type: string, format: date-time }
    CampaignStep:
      type: object
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        order: { type: integer }
        type:
          type: string
          enum: [email, task, wait, condition]
        subject: { type: string }
        body: { type: string }
        delay_days: { type: integer }
    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        secret: { type: string, description: HMAC signing secret (returned once on create) }
        created_at: { type: string, format: date-time }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        url: { type: string, format: uri }
        linked_entity_type:
          type: string
          enum: [contact, company, deal]
        linked_entity_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    Workflow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        trigger: { type: object, additionalProperties: true }
        steps:
          type: array
          items: { type: object, additionalProperties: true }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, example: wbk_abc12345 }
        key:
          type: string
          description: Full key (returned once on create).
        permissions:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system, tool]
              content: { type: string }
              created_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        attendees:
          type: array
          items: { type: string, format: email }
        location: { type: string }
        description: { type: string }
    EmailThread:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        participants:
          type: array
          items: { type: string, format: email }
        message_count: { type: integer }
        last_message_at: { type: string, format: date-time }
    EmailMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        thread_id: { type: string, format: uuid }
        from: { type: string, format: email }
        to:
          type: array
          items: { type: string, format: email }
        subject: { type: string }
        body_html: { type: string }
        body_text: { type: string }
        sent_at: { type: string, format: date-time }
    Correspondent:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        message_count: { type: integer }
        last_contacted_at: { type: string, format: date-time }
    ChannelMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel:
          type: string
          enum: [whatsapp, sms, telegram, slack]
        direction:
          type: string
          enum: [inbound, outbound]
        from: { type: string }
        to: { type: string }
        body: { type: string }
        sent_at: { type: string, format: date-time }
    Provider:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        enabled: { type: boolean }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string }
        profile_picture_url: { type: string, format: uri }
    LexiTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status:
          type: string
          enum: [pending, approved, dismissed, executed]
        proposal: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Prospect:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        title: { type: string }
        company_name: { type: string }
        email: { type: string, format: email }
        linkedin_url: { type: string, format: uri }
        member_id: { type: [string, integer], description: "Prospector search only." }
        company_id: { type: [string, integer], description: "Prospector search only." }
        document_id: { type: string, description: "Prospector search only. Pass to POST /v1/prospector/reveal or POST /v1/email/enrich." }
    ListResponse:
      type: object
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
        meta:
          $ref: "#/components/schemas/Meta"
    EmailEnrichRequest:
      type: object
      description: |
        Either `document_id` (from `POST /v1/prospector/search`), or the person's name
        (`first_name` + `last_name`, or `full_name`) plus their company `domain`.
      properties:
        document_id: { type: string, example: "123456_7890", description: "A-Leads document id: `<member_id>_<company_id>` from prospector search." }
        first_name: { type: string, example: Anna }
        last_name: { type: string, example: Roth }
        full_name: { type: string, example: Anna Roth }
        domain: { type: string, example: acme.com, description: "Company domain; a URL is accepted and reduced to its host." }
    EmailRevealResult:
      type: object
      required: [email, verification, already_in_crm, charged, refunded]
      properties:
        email: { type: [string, "null"], format: email, example: anna.roth@acme.com }
        email_status: { type: [string, "null"], description: "Provider status as returned, e.g. `verified`." }
        verification:
          type: [string, "null"]
          enum: [verified, unverified, null]
          description: "`verified` only when the provider verified the address; null when no email was found."
        already_in_crm: { type: boolean, description: "The workspace already has a contact with this email; no credit is used." }
        charged: { type: boolean, description: "1 credit was used. Only a verified email the workspace does not already hold is charged." }
        refunded: { type: boolean, description: "The credit taken at the start was returned (no email, unverified, already in CRM, or provider error)." }
    EmailEnrichPerson:
      type: object
      properties:
        document_id: { type: string }
        full_name: { type: [string, "null"] }
        job_title: { type: [string, "null"] }
        company: { type: [string, "null"] }
        company_domain: { type: [string, "null"] }
        linkedin_url: { type: [string, "null"] }
    EmailEnrichResult:
      allOf:
        - { $ref: "#/components/schemas/EmailRevealResult" }
        - type: object
          required: [credits_used, person]
          properties:
            credits_used: { type: integer, enum: [0, 1] }
            person: { $ref: "#/components/schemas/EmailEnrichPerson" }
    ProspectRevealResult:
      allOf:
        - { $ref: "#/components/schemas/EmailRevealResult" }
        - type: object
          required: [document_id, email_verified]
          properties:
            document_id: { type: string }
            member_id: { type: [string, integer, "null"] }
            company_id: { type: [string, integer, "null"] }
            email_verified: { type: boolean, description: "Same as `verification == verified`." }
    BulkResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        deleted: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              error: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: API key lacks the required permission scope.
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
        X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
        Retry-After:
          description: Seconds until retry allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InsufficientCredits:
      description: "Not enough credits (`insufficient_credits`). Nothing was charged."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: "The email provider failed (`upstream_error`, 502; the credit is refunded unless the message says otherwise), or the reveal did not answer in time (`upstream_timeout`, 504; the outcome is unknown, check the credit balance before retrying)."
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request body or parameters failed validation.
      headers:
        X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /v1/contacts:
    get:
      operationId: listContacts
      summary: List contacts
      description: List all contacts in the workspace with pagination.
      tags: [Contacts]
      x-permission-scope: contacts:read
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PerPageQuery" }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Contact" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createContact
      summary: Create contact
      description: Create a single contact.
      tags: [Contacts]
      x-permission-scope: contacts:write
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactCreate" }
      responses:
        "201":
          description: Created
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/contacts/bulk:
    post:
      operationId: bulkCreateContacts
      summary: Bulk create contacts
      description: Create up to 500 contacts in one request.
      tags: [Contacts]
      x-permission-scope: contacts:write
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacts]
              properties:
                contacts:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/ContactCreate" }
      responses:
        "200":
          description: Bulk create result
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/contacts/bulk-delete:
    post:
      operationId: bulkDeleteContacts
      summary: Bulk delete contacts
      description: Delete up to 500 contacts by ID in one request.
      tags: [Contacts]
      x-permission-scope: contacts:delete
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          headers:
