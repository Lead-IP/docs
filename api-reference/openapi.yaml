  /v1/email/enrich:
    post:
      operationId: enrichEmail
      summary: Find a work email
      description: |
        Finds a person's work email from their name and company domain, or from a
        `document_id` returned by `POST /v1/prospector/search`.

        Billing: the people search is free. Revealing the email costs **1 credit only when
        the provider verifies an email the workspace does not already hold**; a missing,
        unverified or already-known email is refunded (`charged: false`, `refunded: true`).
        Send an `Idempotency-Key` to retry safely: a repeat with the same key returns the
        stored response and is not charged again.

        `POST /v1/enrich/email` is an alias with the same contract.
      tags: [Enrichment]
      x-permission-scope: enrichment:write
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailEnrichRequest" }
            examples:
              byName: { value: { first_name: Anna, last_name: Roth, domain: acme.com } }
              byDocument: { value: { document_id: "123456_7890" } }
      responses:
        "200":
          description: "The lookup ran. `email` is null when none was found (no credit used)."
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EmailEnrichResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/InsufficientCredits" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`person_not_found`: nobody with that name at that domain. No credit used."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`ambiguous_person`: several people with that name at that domain. Retry with one candidate's `document_id`. No credit used."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          candidates:
                            type: array
                            items: { $ref: "#/components/schemas/EmailEnrichPerson" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503":
          description: "`service_unavailable`: email enrichment is not configured on this server."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504": { $ref: "#/components/responses/UpstreamError" }
  /v1/enrich/email:
    post:
      operationId: enrichEmailAlias
      summary: Find a work email (alias)
      description: Alias of `POST /v1/email/enrich`, same request, response and billing.
      tags: [Enrichment]
