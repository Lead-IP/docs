  /v1/prospector/reveal/bulk:
    post:
      operationId: prospectorRevealBulk
      summary: Reveal emails for several prospects
      description: |
        Up to 25 prospects, one billed reveal each (see `POST /v1/prospector/reveal`).
        Duplicates are skipped. After `insufficient_credits`, three provider failures in a
        row, or about 90 seconds, the remaining items are returned as `skipped` and are not
        charged.
      tags: [Prospector]
      x-permission-scope: prospects:write
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prospects]
              properties:
                prospects:
                  type: array
                  maxItems: 25
                  items:
                    oneOf:
                      - type: string
                        description: document_id
                      - type: object
                        properties:
                          document_id: { type: string }
                          member_id: { type: [string, integer] }
                          company_id: { type: [string, integer] }
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            X-RateLimit-Limit: { $ref: "#/components/headers/X-RateLimit-Limit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/X-RateLimit-Reset" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          required: [document_id, status]
                          description: "On `success` the item also carries every `EmailRevealResult` field and `email_verified`."
                          properties:
                            document_id: { type: [string, "null"] }
                            status: { type: string, enum: [success, failed, skipped] }
                            error:
                              type: string
                              description: "Set when status is failed or skipped: an error code, or `duplicate`, `insufficient_credits`, `upstream_unavailable`, `time_budget_exhausted`."
                            email: { type: [string, "null"] }
                            email_status: { type: [string, "null"] }
                            verification: { type: [string, "null"] }
                            already_in_crm: { type: boolean }
                            charged: { type: boolean }
                            refunded: { type: boolean }
                            email_verified: { type: boolean }
                      summary:
                        type: object
                        properties:
                          total: { type: integer }
                          succeeded: { type: integer }
                          failed: { type: integer }
                          skipped: { type: integer }
                          credits_used: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
